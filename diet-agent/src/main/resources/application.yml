# ==========================================
# 饮食推荐 Agent 主配置
# 敏感信息（数据库密码、API Key）请放入 application-dev.yml（不提交 git）
# ==========================================

spring:
  application:
    name: diet-agent
  profiles:
    active: dev

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

diet:
  auth:
    jwt-secret-base64: ${DIET_JWT_SECRET_BASE64:}
    token-hours: ${DIET_TOKEN_HOURS:24}
    admin-username: ${DIET_ADMIN_USERNAME:}
    admin-password: ${DIET_ADMIN_PASSWORD:}
  llm:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    endpoint-path: /chat/completions
    main-model: qwen-max
    light-model: qwen-turbo
  cors:
    allowed-origin-patterns: ${DIET_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
  session:
    max-history-turns: 10

logging:
  level:
    com.diet: INFO
